name: Terraform Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - 'argocd-prod/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

env:
  TF_VERSION: '1.9.0'

jobs:
  terraform-gke:
    name: 'Terraform GKE'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true

      - name: GCP Setup
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Terraform Init
        run: terraform init
        working-directory: terraform/gke

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: terraform/gke

      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform/gke

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        working-directory: terraform/gke
        continue-on-error: true

      - name: Upload Plan
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-gke
          path: terraform/gke/tfplan
          retention-days: 2

  terraform-oracle:
    name: 'Terraform Oracle'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true

      - name: Oracle Cloud Setup
        if: vars.OCI_TENANCY_OCID != ''
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" | base64 -d > ~/.oci/oci_key
          chmod 600 ~/.oci/oci_key
          cat > ~/.oci/config << 'EOF'
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/oci_key
          EOF

      - name: Terraform Init
        run: terraform init
        working-directory: terraform/oracle

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: terraform/oracle

      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform/oracle

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -var-file="terraform.tfvars" -out=tfplan
        working-directory: terraform/oracle
        continue-on-error: true

      - name: Upload Plan
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-oracle
          path: terraform/oracle/tfplan
          retention-days: 2

  terraform-apply-gke:
    name: 'Terraform Apply GKE'
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/infra-')
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: GCP Setup
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Terraform Init
        run: terraform init
        working-directory: terraform/gke

      - name: Terraform Apply
        run: terraform apply -var-file="terraform.tfvars" -auto-approve
        working-directory: terraform/gke

      - name: Discord Notification
        if: always()
        run: |
          curl -X POST "${{ vars.DISCORD_WEBHOOK || 'https://discord.com/api/webhooks/fake' }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"🏗️ GKE Infrastructure ${{ job.status }}!\nTag: \`${{ github.ref_name }}\`\"}" \
            || true

  terraform-apply-oracle:
    name: 'Terraform Apply Oracle'
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/infra-')
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Oracle Cloud Setup
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" | base64 -d > ~/.oci/oci_key
          chmod 600 ~/.oci/oci_key
          cat > ~/.oci/config << 'EOF'
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/oci_key
          EOF

      - name: Terraform Apply
        run: terraform apply -var-file="terraform.tfvars" -auto-approve
        working-directory: terraform/oracle
