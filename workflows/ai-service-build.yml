name: Build and Push

on:
  push:
    branches:
      - main
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'k8s/**'
      - '.github/workflows/build.yml'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag'
        required: false
        type: string
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: smarteventmanagementsystem
  GO_VERSION: '1.22'

jobs:
  build:
    name: 'Build & Push ai-service'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUG_REF#refs/tags/}"
          else
            TAG="sha-$(echo $GITHUB_SHA | cut -c1-7)"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Image tag: $TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PAT }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/ai-service:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/ai-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      # === GitOps: Update kustomization image tag ===
      - name: Update kustomization image tag
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          sed -i "s/newTag:.*/newTag: $TAG/" k8s/overlays/prod/kustomization.yaml
          echo "Updated k8s/overlays/prod/kustomization.yaml with tag: $TAG"

      - name: Commit and push tag bump
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add k8s/overlays/prod/kustomization.yaml
          git diff --cached --quiet && echo "No changes to commit" || {
            git commit -m "chore: bump ai-service image to ${{ steps.vars.outputs.tag }} [skip ci]"
            git push
          }

      - name: Summary
        run: |
          echo "## Build Summary"
          echo "- **Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/ai-service:${{ steps.vars.outputs.tag }}\`"
          echo "- **Commit:** \`${{ github.sha }}\`"
