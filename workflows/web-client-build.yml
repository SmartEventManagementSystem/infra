name: Build and Push

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.github/workflows/build.yml'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag'
        required: false
        type: string
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: smarteventmanagementsystem

jobs:
  build:
    name: 'Build & Push web-client'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="sha-$(echo $GITHUB_SHA | cut -c1-7)"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Image tag: $TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PAT }}

      - name: Create Dockerfile
        if: runner.os == 'Linux'
        run: |
          cat > Dockerfile << 'DOCKERFILE_EOF'
          # Build stage
          FROM node:20-alpine AS builder
          WORKDIR /app
          COPY package*.json ./
          RUN npm ci
          COPY . .
          RUN npm run build

          # Production stage
          FROM nginx:alpine
          COPY nginx.conf /etc/nginx/conf.d/default.conf
          COPY --from=builder /app/dist /usr/share/nginx/html
          EXPOSE 80
          HEALTHCHECK --interval=30s --timeout=3s --start-period=5s --retries=3 CMD wget -qO- http://localhost/health || exit 1
          CMD ["nginx", "-g", "daemon off;"]
          DOCKERFILE_EOF

          cat > nginx.conf << 'NGINX_EOF'
          server {
              listen 80;
              server_name localhost;
              root /usr/share/nginx/html;
              index index.html;
              location /health {
                  return 200 'healthy';
                  add_header Content-Type text/plain;
              }
              location / {
                  try_files $uri $uri/ /index.html;
              }
              location /api {
                  proxy_pass http://event-service:8080;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
              }
          }
          NGINX_EOF

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web-client:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web-client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      # === GitOps: Update kustomization image tag ===
      - name: Update kustomization image tag
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          sed -i "s/newTag:.*/newTag: $TAG/" k8s/overlays/prod/kustomization.yaml
          echo "Updated k8s/overlays/prod/kustomization.yaml with tag: $TAG"

      - name: Commit and push tag bump
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add k8s/overlays/prod/kustomization.yaml
          git diff --cached --quiet && echo "No changes to commit" || {
            git commit -m "chore: bump web-client image to ${{ steps.vars.outputs.tag }} [skip ci]"
            git push
          }

      - name: Summary
        run: |
          echo "## Build Summary"
          echo "- **Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web-client:${{ steps.vars.outputs.tag }}\`"
          echo "- **Commit:** \`${{ github.sha }}\`"
