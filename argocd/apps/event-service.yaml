apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: event-service
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: ems-platform
  annotations:
    argocd.argoproj.io/watch: "true"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/smarteventmanagementsystem/event-service-platform.git
    targetRevision: main
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: event-service
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
  ignoreDifferences:
    - group: argoproj.io
      kind: Rollout
      jsonPointers:
        - /spec/replicas
        - /status
