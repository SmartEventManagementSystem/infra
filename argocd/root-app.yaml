---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ems-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: ems-root
    app.kubernetes.io/part-of: ems-platform
spec:
  project: default
  source:
    repoURL: https://github.com/smarteventmanagementsystem/infra.git
    targetRevision: main
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
