# ArgoCD Installation — declarative manifests
# Deploy with: kubectl apply -f argocd-install.yaml
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-server
  namespace: argocd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-server
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
  - nonResourceURLs: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-server-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-server
subjects:
  - kind: ServiceAccount
    name: argocd-server
    namespace: argocd
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  resource.customizations: |
    argoproj.io/Rollout:
      health.lua: |
        hs = {}
        hs.status = "Progressing"
        if obj.status ~= nil then
          if obj.status.health ~= nil then
            hs.status = obj.status.health.status
          end
        end
        return hs
  ui.cssurl: ""
  timeout.reconciliation: "180s"
  application.instanceLabelKey: "app.kubernetes.io/instance"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
data:
  policy.default: role:readonly
  policy.csv: |
    p, role:admin, *, *, allow
    p, role:readonly, *, get, allow
    g, system:masters, role:admin
---
# Dex (OAuth) — disabled for now, use local admin
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-dex-cfg
  namespace: argocd
---
# ArgoCD Server Service
apiVersion: v1
kind: Service
metadata:
  name: argocd-server
  namespace: argocd
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: https
      port: 443
      targetPort: 8080
  selector:
    app: argocd-server
---
# ArgoCD Redis Service
apiVersion: v1
kind: Service
metadata:
  name: argocd-redis
  namespace: argocd
spec:
  ports:
    - port: 6379
  selector:
    app: argocd-redis
---
# ArgoCD Repo Server Service
apiVersion: v1
kind: Service
metadata:
  name: argocd-repo-server
  namespace: argocd
spec:
  ports:
    - name: repo-server
      port: 8081
  selector:
    app: argocd-repo-server
---
# ArgoCD Application Controller Service
apiVersion: v1
kind: Service
metadata:
  name: argocd-application-controller
  namespace: argocd
spec:
  ports:
    - name: controller
      port: 8082
  selector:
    app: argocd-application-controller
---
# ArgoCD Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-redis
  namespace: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argocd-redis
  template:
    metadata:
      labels:
        app: argocd-redis
    spec:
      imagePullSecrets:
        - name: gcr-json-key
      containers:
        - name: redis
          image: asia-southeast1-docker.pkg.dev/project-5ca79767-316d-4e68-a56/argocd/redis:7.4.0-alpine
          imagePullPolicy: Always
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
# ArgoCD Repo Server Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
  namespace: argocd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: argocd-repo-server
  template:
    metadata:
      labels:
        app: argocd-repo-server
    spec:
      serviceAccountName: argocd-server
      imagePullSecrets:
        - name: gcr-json-key
      containers:
        - name: argocd-repo-server
          image: asia-southeast1-docker.pkg.dev/project-5ca79767-316d-4e68-a56/argocd/argocd:v2.13.3
          imagePullPolicy: Always
          command: ["argocd-repo-server"]
          ports:
            - containerPort: 8081
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: ARGOCD_RECONCILIATION_TIMEOUT
              value: "180s"
            - name: REDIS
              value: argocd-redis:6379
          volumeMounts:
            - name: ssh-known-hosts
              mountPath: /app/ssh-known-hosts
            - name: tls-certs
              mountPath: /app/tls-cert
            - name: gpg-keys
              mountPath: /app/gpg-keys
      volumes:
        - name: ssh-known-hosts
          emptyDir: {}
        - name: tls-certs
          emptyDir: {}
        - name: gpg-keys
          emptyDir: {}
---
# ArgoCD Application Controller Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-application-controller
  namespace: argocd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: argocd-application-controller
  template:
    metadata:
      labels:
        app: argocd-application-controller
    spec:
      serviceAccountName: argocd-server
      imagePullSecrets:
        - name: gcr-json-key
      containers:
        - name: argocd-application-controller
          image: asia-southeast1-docker.pkg.dev/project-5ca79767-316d-4e68-a56/argocd/argocd:v2.13.3
          imagePullPolicy: Always
          command: ["argocd-application-controller"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          env:
            - name: ARGOCD_CONTROLLER_REPLICAS
              value: "2"
            - name: REDIS
              value: argocd-redis:6379
            - name: ARGOCD_RECONCILIATION_TIMEOUT
              value: "180s"
          livenessProbe:
            httpGet:
              path: /health/probe
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/probe
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
---
# ArgoCD Server Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
  namespace: argocd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: argocd-server
  template:
    metadata:
      labels:
        app: argocd-server
    spec:
      serviceAccountName: argocd-server
      imagePullSecrets:
        - name: gcr-json-key
      containers:
        - name: argocd-server
          image: asia-southeast1-docker.pkg.dev/project-5ca79767-316d-4e68-a56/argocd/argocd:v2.13.3
          imagePullPolicy: Always
          command: ["argocd-server"]
          ports:
            - containerPort: 8080
            - containerPort: 8083
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: ARGOCD_SERVER_REPLICAS
              value: "2"
            - name: REDIS
              value: argocd-redis:6379
            - name: ARGOCD_REPO_SERVER
              value: argocd-repo-server:8081
            - name: ARGOCD_CONTROLLER_CONFIGMAP
              value: argocd-cm
            - name: ARGOCD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: argocd-admin-password
                  key: password
            - name: ARGOCD_API_CONTENT_TYPE
              value: "application/json"
            - name: ARGOCD_SERVER_INSECURE
              value: "true"
            - name: ARGOCD_SERVER_BASEHREF
              value: "/"
          volumeMounts:
            - name: ssh-known-hosts
              mountPath: /app/ssh-known-hosts
            - name: tls-certs
              mountPath: /app/tls-cert
            - name: gpg-keys
              mountPath: /app/gpg-keys
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: ssh-known-hosts
          emptyDir: {}
        - name: tls-certs
          emptyDir: {}
        - name: gpg-keys
          emptyDir: {}
---
# ArgoCD Admin Password Secret
apiVersion: v1
kind: Secret
metadata:
  name: argocd-admin-password
  namespace: argocd
type: Opaque
stringData:
  password: "changeme-set-via-kustomize-patch"
