# ArgoCD Installation — declarative manifests
# Deploy with:
# curl -s https://raw.githubusercontent.com/argoproj/argo-cd/v2.13.3/manifests/install.yaml | \
#   sed 's|quay.io/argoproj/argocd:v2.13.3|asia-southeast1-docker.pkg.dev/PROJECT/argocd/argocd:v2.13.3|g' | \
#   sed 's|redis:7.4.0-alpine|asia-southeast1-docker.pkg.dev/PROJECT/argocd/redis:7.4.0-alpine|g' | \
#   kubectl apply -n argocd -f -
#
# Note: Images are mirrored to GCR because cluster cannot reach quay.io/ghcr.io directly.
# GCR repo must be public or imagePullSecrets must be configured.
