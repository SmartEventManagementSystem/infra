name: Deploy EMS Platform

on:
  push:
    branches:
      - main
    paths:
      - 'data-platform/**'
      - 'terraform/oracle/docker-compose.prod.yml'
      - '.github/workflows/docker-deploy.yml'

  workflow_dispatch:
    inputs:
      action:
        description: 'Action'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - restart
          - logs
          - status
      vm_ip:
        description: 'VM IP Address (for manual deploy)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    name: 'Deploy to Production'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy to VM
        run: |
          # Use workflow dispatch input or GitHub variable
          VM_IP="${{ github.event.inputs.vm_ip || vars.VM_HOST || vars.PRIMARY_VM_IP || '' }}"

          if [ -z "$VM_IP" ]; then
            echo "❌ VM_IP not set! Please set VM_HOST in GitHub Variables or provide vm_ip input."
            echo "Go to: GitHub → Settings → Variables → Actions → New repository variable"
            echo "  Name: VM_HOST"
            echo "  Value: your-vm-public-ip"
            exit 1
          fi

          echo "Deploying to VM: $VM_IP"

          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key ubuntu@$VM_IP << 'ENDSSH'
          set -e
          cd /home/ubuntu/ems-platform

          # Pull latest code
          git pull origin main || true

          # Create .env if not exists
          if [ ! -f .env ]; then
            cat > .env << 'ENVEOF'
            # PostgreSQL
            POSTGRES_HOST=${{ vars.POSTGRES_HOST || 'localhost' }}
            POSTGRES_PORT=5432
            POSTGRES_DB=ems_events
            POSTGRES_USER=emsuser
            POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD || 'password' }}

            # Redis
            REDIS_HOST=${{ vars.REDIS_HOST || 'localhost' }}
            REDIS_PORT=6379
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD || 'redispass123' }}

            # MinIO
            MINIO_PASSWORD=${{ secrets.MINIO_PASSWORD || 'minioadmin123' }}

            # Kafka
            KAFKA_BROKERS=${{ vars.KAFKA_BROKERS || 'localhost:9092' }}
            ENVEOF
          fi

          # Pull latest images
          docker compose pull || true

          # Restart services
          docker compose down || true
          docker compose up -d --remove-orphans

          echo "✅ Deployment complete!"
          ENDSSH

      - name: Health Check
        if: vars.VM_HOST != ''
        run: |
          VM_IP="${{ github.event.inputs.vm_ip || vars.VM_HOST || vars.PRIMARY_VM_IP }}"
          sleep 30
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key ubuntu@$VM_IP << 'ENDSSH'
          echo "=== Container Status ==="
          docker ps --format "table {{.Names}}\t{{.Status}}"

          echo ""
          echo "=== Health Checks ==="
          curl -sf http://localhost:8088/api/v1/health && echo "✅ Superset" || echo "❌ Superset"
          curl -sf http://localhost:8085/health && echo "✅ Airflow" || echo "❌ Airflow"
          curl -sf http://localhost:8090/api/health && echo "✅ Kafka UI" || echo "❌ Kafka UI"
          curl -sf http://localhost:9000/minio/health/live && echo "✅ MinIO" || echo "❌ MinIO"
          curl -sf http://localhost:9200 && echo "✅ Elasticsearch" || echo "❌ Elasticsearch"
          ENDSSH

  status:
    name: 'Check Status'
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'status'

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Check Status
        run: |
          VM_IP="${{ github.event.inputs.vm_ip || vars.VM_HOST || vars.PRIMARY_VM_IP }}"
          if [ -z "$VM_IP" ]; then
            echo "❌ VM_IP not set!"
            exit 1
          fi

          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key ubuntu@$VM_IP << 'ENDSSH'
          echo "=== EMS Platform Status ==="
          echo ""
          echo "Docker Containers:"
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          echo ""
          echo "Disk Usage:"
          df -h / /var/lib/docker
          echo ""
          echo "Memory Usage:"
          free -h
          ENDSSH

  logs:
    name: 'View Logs'
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'logs'

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: View Logs
        run: |
          VM_IP="${{ github.event.inputs.vm_ip || vars.VM_HOST || vars.PRIMARY_VM_IP }}"
          if [ -z "$VM_IP" ]; then
            echo "❌ VM_IP not set!"
            exit 1
          fi

          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key ubuntu@$VM_IP << 'ENDSSH'
          cd /home/ubuntu/ems-platform
          docker compose logs --tail=50
          ENDSSH

  restart:
    name: 'Restart Services'
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'restart'

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Restart
        run: |
          VM_IP="${{ github.event.inputs.vm_ip || vars.VM_HOST || vars.PRIMARY_VM_IP }}"
          if [ -z "$VM_IP" ]; then
            echo "❌ VM_IP not set!"
            exit 1
          fi

          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key ubuntu@$VM_IP << 'ENDSSH'
          cd /home/ubuntu/ems-platform
          docker compose restart
          echo "✅ Services restarted"
          ENDSSH
