name: Deploy Services

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'docker/**'
      - 'docker-compose*.yml'
      - 'Dockerfile'
      - '.github/workflows/docker-deploy.yml'
      - 'apps/**'
      - 'services/**'

  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - development

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/ems

jobs:
  # ============================================
  # BUILD IMAGES
  # ============================================
  build:
    name: 'Build Images'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      superset_hash: ${{ steps.meta.outputs.digest_superset }}
      airflow_hash: ${{ steps.meta.outputs.digest_airflow }}
      kafka_hash: ${{ steps.meta.outputs.digest_kafka }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build Superset
        uses: docker/build-push-action@v5
        with:
          context: ./docker/superset
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/superset:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Airflow
        uses: docker/build-push-action@v5
        with:
          context: ./docker/airflow
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/airflow:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Kafka UI
        uses: docker/build-push-action@v5
        with:
          context: ./docker/kafka-ui
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/kafka-ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Nginx
        uses: docker/build-push-action@v5
        with:
          context: ./docker/nginx
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/nginx:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # DEPLOY TO VM
  # ============================================
  deploy-vm:
    name: 'Deploy to VM'
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ vars.VM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull Images
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ vars.VM_HOST }} << 'ENDSSH'
          # Login to GHCR
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

          # Pull new images
          docker pull ${{ env.REGISTRY }}/${{ github.repository }}/superset:${{ github.sha }}
          docker pull ${{ env.REGISTRY }}/${{ github.repository }}/airflow:${{ github.sha }}
          docker pull ${{ env.REGISTRY }}/${{ github.repository }}/kafka-ui:${{ github.sha }}
          docker pull ${{ env.REGISTRY }}/${{ github.repository }}/nginx:${{ github.sha }}

          echo "✅ Images pulled successfully"
          ENDSSH

      - name: Update Docker Compose
        run: |
          # Update image tags in docker-compose
          sed -i 's|image: .*superset:|image: ${{ env.REGISTRY }}/${{ github.repository }}/superset:${{ github.sha }}|g' docker-compose.prod.yml
          sed -i 's|image: .*airflow:|image: ${{ env.REGISTRY }}/${{ github.repository }}/airflow:${{ github.sha }}|g' docker-compose.prod.yml
          sed -i 's|image: .*kafka-ui:|image: ${{ env.REGISTRY }}/${{ github.repository }}/kafka-ui:${{ github.sha }}|g' docker-compose.prod.yml
          sed -i 's|image: .*nginx:|image: ${{ env.REGISTRY }}/${{ github.repository }}/nginx:${{ github.sha }}|g' docker-compose.prod.yml

      - name: Copy and Deploy
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ vars.VM_HOST }} << 'ENDSSH'
          mkdir -p /home/ubuntu/ems-platform
          cd /home/ubuntu/ems-platform

          # Backup current docker-compose
          cp docker-compose.yml docker-compose.yml.backup || true

          # Stop current services
          docker compose down || true

          # Pull latest code
          git pull origin main || echo "No git repo on VM"

          # Update images
          docker pull ${{ env.REGISTRY }}/${{ github.repository }}/superset:${{ github.sha }}
          docker pull ${{ env.REGISTRY }}/${{ github.repository }}/airflow:${{ github.sha }}
          docker pull ${{ env.REGISTRY }}/${{ github.repository }}/kafka-ui:${{ github.sha }}

          # Tag images for compose
          docker tag ${{ env.REGISTRY }}/${{ github.repository }}/superset:${{ github.sha }} ems-superset:latest
          docker tag ${{ env.REGISTRY }}/${{ github.repository }}/airflow:${{ github.sha }} ems-airflow:latest
          docker tag ${{ env.REGISTRY }}/${{ github.repository }}/kafka-ui:${{ github.sha }} ems-kafka-ui:latest

          # Start services
          docker compose up -d

          # Cleanup old images
          docker image prune -f

          echo "✅ Deployment complete!"
          ENDSSH

      - name: Health Check
        run: |
          sleep 30
          ssh -o StrictHostKeyChecking=no ubuntu@${{ vars.VM_HOST }} << 'ENDSSH'
          docker ps --format "table {{.Names}}\t{{.Status}}"

          # Check health endpoints
          curl -sf http://localhost:8088/health || echo "Superset: unhealthy"
          curl -sf http://localhost:8085/health || echo "Airflow: unhealthy"
          curl -sf http://localhost:8090/api/health || echo "Kafka UI: unhealthy"
          ENDSSH

  # ============================================
  # RUN TESTS
  # ============================================
  test:
    name: 'Run Tests'
    runs-on: ubuntu-latest
    needs: deploy-vm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run API Tests
        run: |
          echo "Running integration tests..."

          # Test Superset
          curl -sf http://${{ vars.VM_HOST }}:8088/api/v1/health && echo "✅ Superset OK"

          # Test Airflow
          curl -sf http://${{ vars.VM_HOST }}:8085/api/v1/health && echo "✅ Airflow OK"

      - name: Database Tests
        run: |
          # Test PostgreSQL connection
          PGPASSWORD=${{ secrets.DB_PASSWORD }} psql -h ${{ vars.DB_HOST }} -U emsuser -d ems_events -c "SELECT 1;" && echo "✅ PostgreSQL OK"

  # ============================================
  # NOTIFY
  # ============================================
  notify:
    name: 'Notify'
    runs-on: ubuntu-latest
    needs: [deploy-vm, test]
    if: always()

    steps:
      - name: Discord Notification
        if: vars.DISCORD_WEBHOOK != ''
        run: |
          STATUS="${{ needs.deploy-vm.result == 'success' && '✅ Success' || '❌ Failed' }}"
          curl -X POST ${{ vars.DISCORD_WEBHOOK }} \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"EMS Platform Deployment - $STATUS\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\"}"

      - name: Update Commit Status
        uses: myrotvorets/report-action@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          status: ${{ needs.deploy-vm.result == 'success' && 'success' || 'failure' }}
          title: "Deployment to VM"
