name: Validate Kubernetes Manifests V2

on:
  push:
    branches: [main]
    paths:
      - '**.yaml'
      - '**.yml'
      - 'kustomization.yaml'
  pull_request:
    paths:
      - '**.yaml'
      - '**.yml'
      - 'kustomization.yaml'

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup kustomize
        uses: ./.github/actions/kustomize

      - name: Validate ArgoCD bootstrap manifests
        run: |
          echo "Validating argocd bootstrap manifests..."
          kubectl apply --dry-run=client -f argocd/bootstrap/ 2>&1 || true

      - name: Validate service manifests
        run: |
          echo "Validating manifests..."
          kubectl apply --dry-run=client \
            -f manifests/networking/ 2>&1 || true
          kubectl apply --dry-run=client \
            -f manifests/external-secrets/ 2>&1 || true
          kubectl apply --dry-run=client \
            -f manifests/dataplatform/ 2>&1 || true

      - name: Validate kustomization
        run: |
          echo "Validating kustomization files..."
          for dir in argocd/apps manifests/networking \
            manifests/external-secrets manifests/dataplatform; do
            if [ -f "$dir/kustomization.yaml" ]; then
              kubectl kustomize "$dir" > /dev/null 2>&1 \
                && echo "✓ $dir OK" || echo "✗ $dir FAILED"
            fi
          done

  lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint .
