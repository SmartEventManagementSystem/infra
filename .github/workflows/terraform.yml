name: Terraform Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
      - 'argocd-prod/**'
    tags:
      - 'infra-*'
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

env:
  TF_VERSION: '1.7.0'

jobs:
  terraform-plan:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true
      - name: GCP Setup
        if: vars.GCP_PROJECT_ID != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Terraform Plan
        if: vars.GCP_PROJECT_ID != ''
        id: plan-gcp
        run: |
          printf 'project_id = "%s"\nregion = "%s"\nenvironment = "%s"\ndb_password = "%s"\ndb_user = "%s"\ndb_name = "%s"\nredis_password = "%s"\nvpc_cidr = "%s"\npod_cidr = "%s"\nsvc_cidr = "%s"\nallowed_cidrs = %s\nsystem_node_machine_type = "%s"\napp_node_machine_type = "%s"\ndata_node_machine_type = "%s"\ngcp_service_account_email = "%s"\n' \
            '${{ vars.GCP_PROJECT_ID }}' \
            'asia-southeast1' \
            'prod' \
            'placeholder' \
            'emsuser' \
            'ems_events' \
            'placeholder' \
            '10.10.0.0/20' \
            '10.20.0.0/16' \
            '10.30.0.0/20' \
            '["0.0.0.0/0"]' \
            'e2-micro' \
            'e2-micro' \
            'e2-micro' \
            '${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}' > terraform.tfvars
          cd terraform/gcp && terraform init && terraform plan -var-file="../../terraform.tfvars" -no-color -out=tfplan

  terraform-apply:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/infra-')
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true
      - name: GCP Setup
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Terraform Apply
        run: |
          printf 'project_id = "%s"\nregion = "%s"\nenvironment = "%s"\ndb_password = "%s"\ndb_user = "%s"\ndb_name = "%s"\nredis_password = "%s"\nvpc_cidr = "%s"\npod_cidr = "%s"\nsvc_cidr = "%s"\nallowed_cidrs = %s\nsystem_node_machine_type = "%s"\napp_node_machine_type = "%s"\ndata_node_machine_type = "%s"\ngcp_service_account_email = "%s"\n' \
            '${{ vars.GCP_PROJECT_ID }}' \
            'asia-southeast1' \
            'prod' \
            '${{ secrets.GCP_DB_PASSWORD }}' \
            'emsuser' \
            'ems_events' \
            '${{ secrets.GCP_REDIS_PASSWORD }}' \
            '10.10.0.0/20' \
            '10.20.0.0/16' \
            '10.30.0.0/20' \
            '["0.0.0.0/0"]' \
            'e2-micro' \
            'e2-micro' \
            'e2-micro' \
            '${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}' > terraform.tfvars
          cd terraform/gcp && terraform init -lock=false

          # Import ALL existing resources into state
          for res in \
            "google_compute_network.ems_vpc:projects/project-5ca79767-316d-4e68-a56/global/networks/ems-vpc" \
            "google_compute_subnetwork.ems_nodes:projects/project-5ca79767-316d-4e68-a56/regions/asia-southeast1/subnetworks/ems-nodes" \
            "google_service_account.gke_nodes:projects/project-5ca79767-316d-4e68-a56/serviceAccounts/ems-gke-nodes@project-5ca79767-316d-4e68-a56.iam.gserviceaccount.com" \
            "google_service_account.ems_deployer:projects/project-5ca79767-316d-4e68-a56/serviceAccounts/ems-deployer@project-5ca79767-316d-4e68-a56.iam.gserviceaccount.com" \
            "google_container_cluster.ems_cluster:projects/project-5ca79767-316d-4e68-a56/locations/asia-southeast1/clusters/ems-cluster" \
            "google_sql_database_instance.ems_postgres:ems-postgres" \
            "google_redis_instance.ems_redis:projects/project-5ca79767-316d-4e68-a56/locations/asia-southeast1/instances/ems-redis" \
            "google_storage_bucket.ems_backups:project-5ca79767-316d-4e68-a56-ems-backups" \
            "google_storage_bucket.ems_datalake:project-5ca79767-316d-4e68-a56-ems-datalake"; do
            addr="${res%%:*}"
            id="${res##*:}"
            terraform import -lock=false -var-file="../../terraform.tfvars" "$addr" "$id" 2>/dev/null || true
          done

          terraform apply -lock=false -var-file="../../terraform.tfvars" -auto-approve 2>&1
          terraform show 2>/dev/null | head -5
      - name: Discord Notification
        if: always()
        run: |
          curl -X POST "${{ vars.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{"content": "Infrastructure ''''${{ job.status }}''''!\nTag: `'"'"'${{ github.ref_name }}'"'"'`"}'
        continue-on-error: true
