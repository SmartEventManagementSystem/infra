name: Terraform Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
      - 'argocd-prod/**'
    tags:
      - 'infra-*'

  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'

  workflow_dispatch:

env:
  TF_VERSION: '1.7.0'

jobs:
  # ============================================
  # TERRAFORM PLAN (PR & Push)
  # ============================================
  terraform-plan:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true

      # Oracle Cloud
      - name: Oracle Cloud Setup
        if: vars.OCI_TENANCY_OCID != ''
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" | base64 -d > ~/.oci/oci_key
          chmod 600 ~/.oci/oci_key
          cat > ~/.oci/config << 'EOF'
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/oci_key
          EOF
        env:
          OCI_TENANCY_OCID: ${{ vars.OCI_TENANCY_OCID }}

      # GCP
      - name: GCP Setup (Workload Identity)
        if: vars.GCP_PROJECT_ID != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # Plan Oracle
      - name: Terraform Init (Oracle)
        if: vars.OCI_TENANCY_OCID != ''
        run: terraform init
        working-directory: terraform/oracle

      - name: Terraform Plan (Oracle)
        if: vars.OCI_TENANCY_OCID != ''
        id: plan-oracle
        run: |
          terraform plan -no-color -var-file="terraform.tfvars" -out=tfplan
        working-directory: terraform/oracle
        continue-on-error: true

      # Plan GCP
      - name: Terraform Init (GCP)
        if: vars.GCP_PROJECT_ID != ''
        run: terraform init
        working-directory: terraform/gcp

      - name: Terraform Plan (GCP)
        if: vars.GCP_PROJECT_ID != ''
        id: plan-gcp
        run: |
          terraform plan -no-color -var-file="terraform.tfvars" -out=tfplan
        working-directory: terraform/gcp
        continue-on-error: true

  # ============================================
  # TERRAFORM APPLY (Only on Tag Push)
  # ============================================
  terraform-apply:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/infra-')
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true

      # Oracle Cloud
      - name: Oracle Cloud Setup
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" | base64 -d > ~/.oci/oci_key
          chmod 600 ~/.oci/oci_key
          cat > ~/.oci/config << 'EOF'
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/oci_key
          EOF

      - name: Terraform Apply (Oracle)
        run: |
          terraform init
          terraform apply -var-file="terraform.tfvars" -auto-approve
        working-directory: terraform/oracle

      # GCP
      - name: GCP Setup (Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Terraform Apply (GCP)
        run: |
          terraform init
          terraform apply -var-file="terraform.tfvars" -auto-approve
        working-directory: terraform/gcp

      - name: Discord Notification
        if: always()
        run: |
          curl -X POST "${{ vars.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{
              "content": "🏗️ Infrastructure ${{ job.status }}!\nTag: `'${{ github.ref_name }}'`"
            }'
        continue-on-error: true
