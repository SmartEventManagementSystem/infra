name: Terraform Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
      - 'argocd-prod/**'
    tags:
      - 'infra-*'
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

env:
  TF_VERSION: '1.7.0'

jobs:
  terraform-plan:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true
      - name: GCP Setup
        if: vars.GCP_PROJECT_ID != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Terraform Plan
        if: vars.GCP_PROJECT_ID != ''
        id: plan-gcp
        run: |
          printf 'project_id = "%s"\nregion = "%s"\nenvironment = "%s"\ndb_password = "%s"\ndb_user = "%s"\ndb_name = "%s"\nredis_password = "%s"\nvpc_cidr = "%s"\npod_cidr = "%s"\nsvc_cidr = "%s"\nallowed_cidrs = %s\nsystem_node_machine_type = "%s"\napp_node_machine_type = "%s"\ndata_node_machine_type = "%s"\n' \
            '${{ vars.GCP_PROJECT_ID }}' \
            'asia-southeast1' \
            'prod' \
            'placeholder' \
            'emsuser' \
            'ems_events' \
            'placeholder' \
            '10.10.0.0/20' \
            '10.20.0.0/16' \
            '10.30.0.0/20' \
            '["0.0.0.0/0"]' \
            'e2-micro' \
            'e2-micro' \
            'e2-micro' > terraform.tfvars
          cd terraform/gcp && terraform init && terraform plan -var-file="../../terraform.tfvars" -no-color -out=tfplan

  terraform-apply:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/infra-')
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true
      - name: GCP Setup
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Terraform Apply
        run: |
          printf 'project_id = "%s"\nregion = "%s"\nenvironment = "%s"\ndb_password = "%s"\ndb_user = "%s"\ndb_name = "%s"\nredis_password = "%s"\nvpc_cidr = "%s"\npod_cidr = "%s"\nsvc_cidr = "%s"\nallowed_cidrs = %s\nsystem_node_machine_type = "%s"\napp_node_machine_type = "%s"\ndata_node_machine_type = "%s"\n' \
            '${{ vars.GCP_PROJECT_ID }}' \
            'asia-southeast1' \
            'prod' \
            '${{ secrets.GCP_DB_PASSWORD }}' \
            'emsuser' \
            'ems_events' \
            '${{ secrets.GCP_REDIS_PASSWORD }}' \
            '10.10.0.0/20' \
            '10.20.0.0/16' \
            '10.30.0.0/20' \
            '["0.0.0.0/0"]' \
            'e2-micro' \
            'e2-micro' \
            'e2-micro' > terraform.tfvars
          cd terraform/gcp && terraform init && terraform apply -var-file="../../terraform.tfvars" -auto-approve 2>&1
          terraform show 2>/dev/null | head -5
      - name: Discord Notification
        if: always()
        run: |
          curl -X POST "${{ vars.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{"content": "Infrastructure ''''${{ job.status }}''''!\nTag: `'"'"'${{ github.ref_name }}'"'"'`"}'
        continue-on-error: true
