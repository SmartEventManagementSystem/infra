name: Deploy to GKE

on:
  push:
    branches: [main]
    paths:
      - 'manifests/**'
      - 'argocd/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  PROJECT_ID: project-5ca79767-316d-4e68-a56
  SA_EMAIL: github-actions-deploy@project-5ca79767-316d-4e68-a56.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ems-cluster
          location: asia-southeast1
          project_id: project-5ca79767-316d-4e68-a56

      - name: Create GCR imagePullSecrets
        run: |
          echo "${{ secrets.GCP_SA_KEY }}" > /tmp/gcr-key.json
          kubectl create secret docker-registry gcr-json-key --namespace=argocd --docker-server=asia-southeast1-docker.pkg.dev --docker-username=_json_key --docker-password="$(cat /tmp/gcr-key.json)" --docker-email=ci@${{ env.PROJECT_ID }}.iam.gserviceaccount.com -o yaml --dry-run=client | kubectl apply -f -

      - name: Deploy cert-manager
        run: |
          kubectl apply -f manifests/networking/cert-manager/namespace.yaml
          kubectl apply -f manifests/networking/cert-manager/cert-manager.yaml
          sleep 10
          kubectl apply -f manifests/networking/cert-manager/issuers.yaml || true

      - name: Deploy Ingress Nginx
        run: |
          kubectl apply -f manifests/networking/ingress-nginx/ingressclass.yaml
          kubectl apply -f manifests/networking/ingress-nginx/deploy.yaml
          kubectl apply -f manifests/networking/ingress-nginx/svc.yaml

      - name: Deploy Kafka
        run: |
          kubectl apply -f manifests/dataplatform/base/namespace.yaml
          kubectl apply -f manifests/dataplatform/base/kafka-statefulset.yaml

      - name: Configure Docker for GCR
        run: |
          gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet

      - name: Create GCR repository and grant permissions
        run: |
          gcloud artifacts repositories create argocd \
            --repository-format=docker \
            --location=asia-southeast1 \
            --description="ArgoCD images" \
            --project=${{ env.PROJECT_ID }} 2>/dev/null || true

          gcloud artifacts repositories add-iam-policy-binding argocd \
            --location=asia-southeast1 \
            --project=${{ env.PROJECT_ID }} \
            --member=serviceAccount:${{ env.SA_EMAIL }} \
            --role=roles/artifactregistry.writer 2>/dev/null || true

          gcloud projects add-iam-policy-binding ${{ env.PROJECT_ID }} \
            --member=serviceAccount:${{ env.SA_EMAIL }} \
            --role=roles/artifactregistry.writer 2>/dev/null || true

      - name: Pull and push ArgoCD images to GCR
        run: |
          GCR_HOST="asia-southeast1-docker.pkg.dev/${{ env.PROJECT_ID }}/argocd"

          docker pull redis:7.4.0-alpine
          docker tag redis:7.4.0-alpine "${GCR_HOST}/redis:7.4.0-alpine"
          docker push "${GCR_HOST}/redis:7.4.0-alpine"

          docker pull quay.io/argoproj/argocd:v2.13.3
          docker tag quay.io/argoproj/argocd:v2.13.3 "${GCR_HOST}/argocd:v2.13.3"
          docker push "${GCR_HOST}/argocd:v2.13.3"

      - name: Deploy ArgoCD
        run: |
          kubectl create namespace argocd || true
          kubectl apply -n argocd -f argocd/bootstrap/argocd-install.yaml

      - name: Deploy ArgoCD Apps
        run: |
          kubectl apply -n argocd -f argocd/apps/event-service.yaml || true
          kubectl apply -n argocd -f argocd/apps/dataplatform.yaml || true
          kubectl apply -n argocd -f argocd/apps/external-secrets.yaml || true
          kubectl apply -n argocd -f argocd/apps/networking.yaml || true

      - name: Verify
        run: |
          kubectl get pods -A
          kubectl get nodes
