name: Terraform Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/**'

env:
  TF_VERSION: '1.7.0'

jobs:
  # ============================================
  # TERRAFORM APPLY - Oracle Cloud
  # ============================================
  terraform-oracle-apply:
    name: 'Terraform Apply - Oracle Cloud'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: terraform/oracle

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true

      - name: Configure OCI CLI
        run: |
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > /tmp/oci_key
          chmod 600 /tmp/oci_key
          cat > /tmp/oci_config << 'EOF'
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=/tmp/oci_key
          EOF
          mkdir -p ~/.oci
          mv /tmp/oci_config ~/.oci/config

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color \
            -var-file="terraform.tfvars"

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          terraform apply -no-color \
            -var-file="terraform.tfvars" \
            -auto-approve
        continue-on-error: false

      - name: Get Outputs
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: outputs
        run: |
          echo "PRIMARY_VM_IP=$(terraform output -raw primary_vm_ip)" >> $GITHUB_ENV
          echo "KAFKA_VM_IP=$(terraform output -raw kafka_vm_ip)" >> $GITHUB_ENV
          echo "BACKUP_BUCKET=$(terraform output -raw backup_bucket)" >> $GITHUB_ENV

      - name: Update VM IPs
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: EndBug/add-and-commit@v9
        with:
          add: '.'
          message: 'chore: Update Oracle Cloud outputs'

      - name: Notify Success
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "✅ Oracle Cloud deployed successfully!"
          echo "Primary VM IP: ${{ env.PRIMARY_VM_IP }}"
          echo "Kafka VM IP: ${{ env.KAFKA_VM_IP }}"

  # ============================================
  # TERRAFORM APPLY - GCP
  # ============================================
  terraform-gcp-apply:
    name: 'Terraform Apply - GCP'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: terraform/gcp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color \
            -var-file="terraform.tfvars" \
            -var="oracle_vm_ip=${{ vars.ORACLE_VM_IP }}"

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          terraform apply -no-color \
            -var-file="terraform.tfvars" \
            -var="oracle_vm_ip=${{ vars.ORACLE_VM_IP }}" \
            -auto-approve
        continue-on-error: false

      - name: Notify Success
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "✅ GCP deployed successfully!"

  # ============================================
  # DEPLOY SERVICES TO VMs
  # ============================================
  deploy-services:
    name: 'Deploy Services to VMs'
    runs-on: ubuntu-latest
    needs: [terraform-oracle-apply, terraform-gcp-apply]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Copy Docker Compose to VM
        run: |
          ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key \
            ubuntu@${{ vars.PRIMARY_VM_IP }} "mkdir -p /home/ubuntu/ems-platform"

          scp -o StrictHostKeyChecking=no -i /tmp/deploy_key \
            terraform/oracle/docker-compose.prod.yml \
            terraform/oracle/.env.example \
            terraform/oracle/nginx.conf \
            ubuntu@${{ vars.PRIMARY_VM_IP }}:/home/ubuntu/ems-platform/

      - name: Deploy Docker Services
        run: |
          ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key \
            ubuntu@${{ vars.PRIMARY_VM_IP }} << 'ENDSSH'
            cd /home/ubuntu/ems-platform
            cp .env.example .env
            # Generate Fernet key
            python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())" > FERNET_KEY
            docker compose up -d
            echo "✅ Services deployed!"
          ENDSSH

      - name: Setup SSL with Let's Encrypt
        if: vars.DOMAIN != ''
        run: |
          ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key \
            ubuntu@${{ vars.PRIMARY_VM_IP }} << 'ENDSSH'
            docker stop caddy || true
            cat > /tmp/Caddyfile << 'EOF'
            $DOMAIN {
              reverse_proxy localhost:8088
            }
            EOF
            docker run -d \
              --name caddy \
              --restart always \
              -p 80:80 \
              -p 443:443 \
              -v /tmp/Caddyfile:/etc/caddy/Caddyfile \
              caddy:latest
            echo "✅ SSL configured!"
          ENDSSH
        env:
          DOMAIN: ${{ vars.DOMAIN }}

  # ============================================
  # NOTIFY DEPLOYMENT STATUS
  # ============================================
  notify:
    name: 'Notify Deployment'
    runs-on: ubuntu-latest
    needs: [terraform-oracle-apply, terraform-gcp-apply, deploy-services]
    if: always()

    steps:
      - name: Send Discord Notification
        if: vars.DISCORD_WEBHOOK != ''
        uses: sarisia/actions-token-discode@v4
        with:
          webhook: ${{ vars.DISCORD_WEBHOOK }}
          status: ${{ needs.deploy-services.result == 'success' && 'success' || 'failure' }}
          description: |
            EMS Platform Deployment
            - Branch: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
            - Status: ${{ needs.deploy-services.result }}

      - name: Send Slack Notification
        if: vars.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "EMS Platform Deployment - ${{ needs.deploy-services.result }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*EMS Platform Deployment*\n*Branch:* `${{ github.ref_name }}`\n*Status:* `${{ needs.deploy-services.result }}`\n*Commit:* `${{ github.sha }}`"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
