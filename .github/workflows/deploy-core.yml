name: Build and Deploy

on:
  # ============================================
  # BUILD: Mỗi khi push code lên main
  # ============================================
  push:
    branches:
      - main
    paths:
      - 'web-client/**'
      - 'event-service-platform/**'
      - 'ai-platform/**'

  # ============================================
  # DEPLOY: Chỉ khi có TAG (v*)
  # ============================================
  push:
    tags:
      - 'v*'

  # ============================================
  # Manual trigger
  # ============================================
  workflow_dispatch:
    inputs:
      action:
        description: 'Action'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - build-only
          - restart
          - logs

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  # ============================================
  # BUILD IMAGES - Chạy khi push code
  # ============================================
  build:
    name: 'Build Images'
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.event.ref == 'refs/heads/main'

    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      sha_short: ${{ steps.vars.outputs.sha_short }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          SHA_SHORT=$(echo $GITHUB_SHA | cut -c1-7)
          TAG="sha-$SHA_SHORT"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "sha_short=$SHA_SHORT" >> $GITHUB_OUTPUT
          echo "Build tag: $TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------
      # Build web-client (React)
      # ----------------------------------------
      - name: Build web-client
        if: github.event.inputs.web_client != 'false'
        id: web-client
        run: |
          echo "Building web-client..."
          # Create Dockerfile if not exists
          if [ ! -f web-client/Dockerfile ]; then
            cat > web-client/Dockerfile << 'EOF'
            FROM node:20-alpine AS builder
            WORKDIR /app
            COPY package*.json ./
            RUN npm ci
            COPY . .
            RUN npm run build

            FROM nginx:alpine
            COPY --from=builder /app/dist /usr/share/nginx/html
            COPY nginx.conf /etc/nginx/conf.d/default.conf
            EXPOSE 80
            CMD ["nginx", "-g", "daemon off;"]
            EOF

            cat > web-client/nginx.conf << 'EOF'
            server {
                listen 80;
                server_name localhost;
                root /usr/share/nginx/html;
                index index.html;
                location / {
                    try_files $uri $uri/ /index.html;
                }
            }
            EOF
          fi
        working-directory: .

      - name: Push web-client
        uses: docker/build-push-action@v6
        with:
          context: ./web-client
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web-client:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web-client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true

      # ----------------------------------------
      # Build event-service (Go)
      # ----------------------------------------
      - name: Build event-service
        id: event-service
        uses: docker/build-push-action@v6
        with:
          context: ./event-service-platform
          file: ./event-service-platform/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/event-service:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/event-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true

      # ----------------------------------------
      # Build ai-service (Go)
      # ----------------------------------------
      - name: Build ai-service
        id: ai-service
        uses: docker/build-push-action@v6
        with:
          context: ./ai-platform
          file: ./ai-platform/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/ai-service:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/ai-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true

      - name: Discord Build Notification
        if: always()
        run: |
          curl -X POST "${{ vars.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{
              "content": "🔨 Build '${{ job.status }}'\nImage tag: `'${{ steps.vars.outputs.tag }}'`\nCommit: `'${{ github.sha }}'`"
            }'
        continue-on-error: true

  # ============================================
  # DEPLOY - Chạy khi có TAG
  # ============================================
  deploy:
    name: 'Deploy to Production'
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    environment: production

    outputs:
      tag: ${{ steps.vars.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set tag
        id: vars
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Deploying with tag: $TAG"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy to VM
        run: |
          VM_IP="${{ vars.VM_HOST }}"
          TAG="${{ needs.build.outputs.tag || steps.vars.outputs.tag }}"

          if [ -z "$VM_IP" ]; then
            echo "❌ VM_HOST not set!"
            echo "Go to: GitHub → Settings → Variables → Actions → New variable"
            echo "Name: VM_HOST"
            echo "Value: your-vm-ip"
            exit 1
          fi

          echo "=========================================="
          echo "  Deploying to: $VM_IP"
          echo "  Image Tag: $TAG"
          echo "=========================================="

          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key ubuntu@$VM_IP << "ENDSSH"
          set -e
          cd /home/ubuntu/ems-platform

          # Login to GHCR
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ${{ env.REGISTRY }} -u '${{ github.actor }}' --password-stdin

          # Pull latest images with TAG
          echo "Pulling images with tag: $TAG"
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web-client:$TAG || true
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/event-service:$TAG || true
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/ai-service:$TAG || true

          # Create docker-compose.prod.yml
          cat > docker-compose.prod.yml << 'EOF'
          version: '3.8'

          services:
            # Nginx Reverse Proxy
            nginx:
              image: nginx:alpine
              container_name: ems-nginx
              restart: always
              ports:
                - "80:80"
                - "443:443"
              volumes:
                - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
              depends_on:
                - web-client
                - event-service
                - ai-service
              networks:
                - ems-network

            # Web Client
            web-client:
              image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web-client:$TAG
              container_name: ems-web-client
              restart: always
              ports:
                - "3000:80"
              networks:
                - ems-network

            # Event Service
            event-service:
              image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/event-service:$TAG
              container_name: ems-event-service
              restart: always
              environment:
                - DATABASE_URL=postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ vars.DB_HOST }}:5432/${{ secrets.DB_NAME }}
                - REDIS_URL=redis://:${{ secrets.REDIS_PASSWORD }}@${{ vars.REDIS_HOST }}:6379/0
                - KAFKA_BROKERS=${{ vars.KAFKA_BROKERS }}
                - JWT_SECRET=${{ secrets.JWT_SECRET }}
                - PORT=8080
                - GIN_MODE=release
              ports:
                - "8080:8080"
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
                interval: 30s
                timeout: 10s
                retries: 3
              networks:
                - ems-network

            # AI Service
            ai-service:
              image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/ai-service:$TAG
              container_name: ems-ai-service
              restart: always
              environment:
                - DATABASE_URL=postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ vars.DB_HOST }}:5432/${{ secrets.DB_NAME }}
                - REDIS_URL=redis://:${{ secrets.REDIS_PASSWORD }}@${{ vars.REDIS_HOST }}:6379/0
                - OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
                - PORT=8081
              ports:
                - "8081:8081"
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
                interval: 30s
                timeout: 10s
                retries: 3
              networks:
                - ems-network

          networks:
            ems-network:
              name: ems-network
              driver: bridge
          EOF

          # Pull and restart
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

          echo ""
          echo "=========================================="
          echo "  ✅ Deployment Complete!"
          echo "=========================================="
          ENDSSH

      - name: Health Check
        run: |
          VM_IP="${{ vars.VM_HOST }}"
          sleep 45

          echo "Running health checks..."
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key ubuntu@$VM_IP << "ENDSSH"
          echo "=== Container Status ==="
          docker ps --format "table {{.Names}}\t{{.Status}}"

          echo ""
          echo "=== Health Checks ==="
          curl -sf http://localhost/health && echo "✅ Nginx OK" || echo "❌ Nginx DOWN"
          curl -sf http://localhost:8080/health && echo "✅ Event Service OK" || echo "❌ Event Service DOWN"
          curl -sf http://localhost:8081/health && echo "✅ AI Service OK" || echo "❌ AI Service DOWN"
          curl -sf http://localhost:3000 && echo "✅ Web Client OK" || echo "❌ Web Client DOWN"
          ENDSSH

      - name: Discord Success
        if: success()
        run: |
          curl -X POST "${{ vars.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{
              "content": "✅ EMS Platform v'${{ needs.deploy.outputs.tag }}' deployed!\nTag: `'${{ needs.deploy.outputs.tag }}'`\nCommit: `'${{ github.sha }}'`"
            }'
        continue-on-error: true

      - name: Discord Failure
        if: failure()
        run: |
          curl -X POST "${{ vars.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{
              "content": "❌ EMS Platform deployment FAILED!\nTag: `'${{ needs.deploy.outputs.tag }}'`\nCommit: `'${{ github.sha }}'`"
            }'
        continue-on-error: true

  # ============================================
  # MANUAL ACTIONS
  # ============================================
  manual:
    name: 'Manual Actions'
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Restart Services
        if: github.event.inputs.action == 'restart'
        run: |
          VM_IP="${{ vars.VM_HOST }}"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key ubuntu@$VM_IP << "ENDSSH"
          cd /home/ubuntu/ems-platform
          docker compose -f docker-compose.prod.yml restart
          echo "✅ Services restarted"
          ENDSSH

      - name: View Logs
        if: github.event.inputs.action == 'logs'
        run: |
          VM_IP="${{ vars.VM_HOST }}"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key ubuntu@$VM_IP << "ENDSSH"
          cd /home/ubuntu/ems-platform
          docker compose -f docker-compose.prod.yml logs --tail=50
          ENDSSH

      - name: Status Check
        if: github.event.inputs.action == 'status'
        run: |
          VM_IP="${{ vars.VM_HOST }}"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key ubuntu@$VM_IP << "ENDSSH"
          echo "=== EMS Platform Status ==="
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          echo ""
          echo "=== Resource Usage ==="
          docker stats --no-stream
          ENDSSH
