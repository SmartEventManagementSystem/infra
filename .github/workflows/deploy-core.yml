name: Deploy to Production

on:
  # DEPLOY: Push tag (v1.0.0)
  push:
    tags:
      - 'v*'

  # Manual trigger
  workflow_dispatch:
    inputs:
      action:
        description: 'Action'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - restart
          - logs
          - status

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: smarteventmanagementsystem

jobs:
  # ============================================
  # DEPLOY TO VM - Pull from GHCR & Deploy
  # ============================================
  deploy:
    name: 'Deploy to Production'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get tag
        id: vars
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ github.event.inputs.tag || 'latest' }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "=========================================="
          echo "  Deploying tag: $TAG"
          echo "=========================================="

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy to VM
        run: |
          VM_IP="${{ vars.VM_HOST }}"
          TAG="${{ steps.vars.outputs.tag }}"

          if [ -z "$VM_IP" ]; then
            echo "=========================================="
            echo "❌ VM_HOST not configured!"
            echo "=========================================="
            echo "Set in: GitHub → Settings → Variables"
            echo "Name: VM_HOST"
            echo "Value: your-vm-public-ip"
            echo "=========================================="
            exit 1
          fi

          echo "Deploying to $VM_IP with tag $TAG"

          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key ubuntu@$VM_IP << "ENDSSH"
          set -e
          cd /home/ubuntu/ems-platform

          # Login to GHCR
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ${{ env.REGISTRY }} -u '${{ github.actor }}' --password-stdin

          # Set TAG
          export TAG="$TAG"
          export REGISTRY="${{ env.REGISTRY }}"
          export IMAGE_PREFIX="${{ env.IMAGE_PREFIX }}"

          echo "=========================================="
          echo "  TAG: $TAG"
          echo "  REGISTRY: $REGISTRY"
          echo "=========================================="

          # Pull images from GHCR (built by other repos)
          echo "Pulling images from GHCR..."
          docker pull $REGISTRY/$IMAGE_PREFIX/web-client:$TAG || echo "web-client not found, using latest"
          docker pull $REGISTRY/$IMAGE_PREFIX/event-service:$TAG || echo "event-service not found, using latest"
          docker pull $REGISTRY/$IMAGE_PREFIX/ai-service:$TAG || echo "ai-service not found, using latest"

          # Tag images for docker-compose
          docker tag $REGISTRY/$IMAGE_PREFIX/web-client:$TAG ems-web-client:latest 2>/dev/null || true
          docker tag $REGISTRY/$IMAGE_PREFIX/event-service:$TAG ems-event-service:latest 2>/dev/null || true
          docker tag $REGISTRY/$IMAGE_PREFIX/ai-service:$TAG ems-ai-service:latest 2>/dev/null || true

          # Create .env file
          cat > .env << 'EOF'
          REGISTRY=${{ env.REGISTRY }}
          IMAGE_PREFIX=${{ env.IMAGE_PREFIX }}
          TAG=$TAG
          NPM_DB_PASSWORD=${{ secrets.NPM_DB_PASSWORD }}
          NPM_ROOT_PASSWORD=${{ secrets.NPM_ROOT_PASSWORD }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_HOST=${{ vars.DB_HOST }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          REDIS_HOST=${{ vars.REDIS_HOST }}
          KAFKA_BROKERS=${{ vars.KAFKA_BROKERS }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          ALLOWED_ORIGINS=*
          EOF

          # Stop old containers
          docker compose down 2>/dev/null || true

          # Start services
          docker compose up -d --remove-orphans

          echo ""
          echo "=========================================="
          echo "✅ Deployment Complete!"
          echo "=========================================="
          ENDSSH

      - name: Health Check
        run: |
          VM_IP="${{ vars.VM_HOST }}"
          sleep 45

          echo "Running health checks..."
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key ubuntu@$VM_IP << "ENDSSH"
          echo "=== Container Status ==="
          docker ps --format "table {{.Names}}\t{{.Status}}"

          echo ""
          echo "=== Health Checks ==="
          curl -sf http://localhost:81/ 2>/dev/null && echo "✅ Nginx Proxy Manager" || echo "⚠️ Nginx Proxy Manager"
          curl -sf http://localhost:8080/health 2>/dev/null && echo "✅ Event Service" || echo "❌ Event Service"
          curl -sf http://localhost:8081/health 2>/dev/null && echo "✅ AI Service" || echo "❌ AI Service"
          curl -sf http://localhost:3000 2>/dev/null && echo "✅ Web Client" || echo "❌ Web Client"
          ENDSSH

      - name: Discord Success
        if: success()
        run: |
          curl -X POST "${{ vars.DISCORD_WEBHOOK || 'https://discord.com/api/webhooks/fake' }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"✅ EMS Platform v${{ steps.vars.outputs.tag }} deployed!\nVM: \`${{ vars.VM_HOST }}\`\nImages pulled from GHCR\"}"
        continue-on-error: true

      - name: Discord Failure
        if: failure()
        run: |
          curl -X POST "${{ vars.DISCORD_WEBHOOK || 'https://discord.com/api/webhooks/fake' }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"❌ EMS Platform deployment FAILED!\nTag: \`${{ steps.vars.outputs.tag }}\`\"}"
        continue-on-error: true

  # ============================================
  # MANUAL ACTIONS
  # ============================================
  manual:
    name: 'Manual Actions'
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: production

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Restart Services
        if: github.event.inputs.action == 'restart'
        run: |
          VM_IP="${{ vars.VM_HOST }}"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key ubuntu@$VM_IP << "ENDSSH"
          cd /home/ubuntu/ems-platform
          docker compose restart
          echo "✅ Services restarted"
          ENDSSH

      - name: View Logs
        if: github.event.inputs.action == 'logs'
        run: |
          VM_IP="${{ vars.VM_HOST }}"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key ubuntu@$VM_IP << "ENDSSH"
          cd /home/ubuntu/ems-platform
          docker compose logs --tail=30
          ENDSSH

      - name: Check Status
        if: github.event.inputs.action == 'status'
        run: |
          VM_IP="${{ vars.VM_HOST }}"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key ubuntu@$VM_IP << "ENDSSH"
          echo "=== EMS Platform Status ==="
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          echo ""
          echo "=== Images ==="
          docker images | grep ems
          ENDSSH
