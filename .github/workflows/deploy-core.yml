name: Build and Deploy

on:
  # BUILD: Push code to main
  push:
    branches:
      - main
    paths:
      - 'web-client/**'
      - 'event-service-platform/**'
      - 'ai-platform/**'

  # DEPLOY: Push tag (v1.0.0)
  push:
    tags:
      - 'v*'

  # Manual trigger
  workflow_dispatch:
    inputs:
      action:
        description: 'Action'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - build-only
          - restart
          - logs
          - status
      tag:
        description: 'Image tag (e.g., latest, v1.0.0)'
        required: false
        type: string
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  # ============================================
  # BUILD IMAGES
  # ============================================
  build:
    name: 'Build Images'
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      sha_short: ${{ steps.vars.outputs.sha_short }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          SHA_SHORT=$(echo $GITHUB_SHA | cut -c1-7)
          # Use tag if pushed, otherwise use sha
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="sha-$SHA_SHORT"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "sha_short=$SHA_SHORT" >> $GITHUB_OUTPUT
          echo "Build tag: $TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------
      # Build web-client
      # ----------------------------------------
      - name: Prepare web-client Dockerfile
        run: |
          if [ ! -f web-client/Dockerfile ]; then
            cat > web-client/Dockerfile << 'EOF'
            FROM node:20-alpine AS builder
            WORKDIR /app
            COPY package*.json ./
            RUN npm ci
            COPY . .
            RUN npm run build

            FROM nginx:alpine
            COPY --from=builder /app/dist /usr/share/nginx/html
            COPY nginx.conf /etc/nginx/conf.d/default.conf
            EXPOSE 80
            CMD ["nginx", "-g", "daemon off;"]
            EOF

            cat > web-client/nginx.conf << 'EOF'
            server {
                listen 80;
                server_name localhost;
                root /usr/share/nginx/html;
                index index.html;
                location / {
                    try_files $uri $uri/ /index.html;
                }
            }
            EOF
          fi

      - name: Build and Push web-client
        uses: docker/build-push-action@v6
        with:
          context: ./web-client
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web-client:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web-client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----------------------------------------
      # Build event-service
      # ----------------------------------------
      - name: Build and Push event-service
        uses: docker/build-push-action@v6
        with:
          context: ./event-service-platform
          file: ./event-service-platform/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/event-service:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/event-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----------------------------------------
      # Build ai-service
      # ----------------------------------------
      - name: Build and Push ai-service
        uses: docker/build-push-action@v6
        with:
          context: ./ai-platform
          file: ./ai-platform/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/ai-service:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/ai-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Discord Notification
        if: always()
        run: |
          STATUS="${{ job.status }}"
          EMOJI="🔨"
          if [ "$STATUS" == "success" ]; then
            EMOJI="✅"
          else
            EMOJI="❌"
          fi
          curl -X POST "${{ vars.DISCORD_WEBHOOK || 'https://discord.com/api/webhooks/fake' }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"$EMOJI Build $STATUS\nTag: `${{ steps.vars.outputs.tag }}`\nCommit: `${{ github.sha }}`\"}"
        continue-on-error: true

  # ============================================
  # DEPLOY TO VM (Only on tag push)
  # ============================================
  deploy:
    name: 'Deploy to Production'
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "=========================================="
          echo "  Deploying tag: $TAG"
          echo "=========================================="

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy to VM
        run: |
          VM_IP="${{ vars.VM_HOST }}"
          TAG="${{ needs.build.outputs.tag || env.TAG }}"

          if [ -z "$VM_IP" ]; then
            echo "=========================================="
            echo "❌ VM_HOST not configured!"
            echo "=========================================="
            echo "Please set VM_HOST in GitHub Variables:"
            echo "  GitHub → Settings → Variables → Actions"
            echo "  Name: VM_HOST"
            echo "  Value: your-vm-public-ip"
            echo "=========================================="
            exit 1
          fi

          echo "=========================================="
          echo "  VM: $VM_IP"
          echo "  Tag: $TAG"
          echo "=========================================="

          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key ubuntu@$VM_IP << "ENDSSH"
          set -e
          cd /home/ubuntu/ems-platform

          # Login to GHCR
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ${{ env.REGISTRY }} -u '${{ github.actor }}' --password-stdin 2>/dev/null || true

          # Set environment
          export TAG="$TAG"
          export REGISTRY="${{ env.REGISTRY }}"
          export IMAGE_PREFIX="${{ env.IMAGE_PREFIX }}"
          export DB_USER="${{ secrets.DB_USER }}"
          export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
          export DB_NAME="${{ secrets.DB_NAME }}"
          export DB_HOST="${{ vars.DB_HOST }}"
          export REDIS_PASSWORD="${{ secrets.REDIS_PASSWORD }}"
          export REDIS_HOST="${{ vars.REDIS_HOST }}"
          export KAFKA_BROKERS="${{ vars.KAFKA_BROKERS }}"
          export JWT_SECRET="${{ secrets.JWT_SECRET }}"
          export OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}"
          export NPM_DB_PASSWORD="${{ secrets.NPM_DB_PASSWORD }}"
          export NPM_ROOT_PASSWORD="${{ secrets.NPM_ROOT_PASSWORD }}"
          export ALLOWED_ORIGINS="*"

          # Copy docker-compose.prod.yml
          if [ -f docker-compose.prod.yml ]; then
            cp docker-compose.prod.yml docker-compose.yml
          fi

          # Update TAG in environment file
          echo "TAG=$TAG" >> .env
          echo "REGISTRY=$REGISTRY" >> .env
          echo "IMAGE_PREFIX=$IMAGE_PREFIX" >> .env

          # Pull images
          echo "Pulling images..."
          docker pull $REGISTRY/$IMAGE_PREFIX/web-client:$TAG || true
          docker pull $REGISTRY/$IMAGE_PREFIX/event-service:$TAG || true
          docker pull $REGISTRY/$IMAGE_PREFIX/ai-service:$TAG || true

          # Stop old containers
          docker compose down 2>/dev/null || true

          # Start services
          docker compose up -d --remove-orphans

          echo ""
          echo "=========================================="
          echo "✅ Deployment Complete!"
          echo "=========================================="
          ENDSSH

      - name: Health Check
        run: |
          VM_IP="${{ vars.VM_HOST }}"
          sleep 45

          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key ubuntu@$VM_IP << "ENDSSH"
          echo "=== Container Status ==="
          docker ps --format "table {{.Names}}\t{{.Status}}"

          echo ""
          echo "=== Health Checks ==="
          curl -sf http://localhost:81/health 2>/dev/null && echo "✅ Nginx Proxy Manager" || echo "⚠️ Nginx Proxy Manager"
          curl -sf http://localhost:8080/health 2>/dev/null && echo "✅ Event Service" || echo "❌ Event Service"
          curl -sf http://localhost:8081/health 2>/dev/null && echo "✅ AI Service" || echo "❌ AI Service"
          curl -sf http://localhost:3000 2>/dev/null && echo "✅ Web Client" || echo "❌ Web Client"
          ENDSSH

      - name: Discord Success
        if: success()
        run: |
          curl -X POST "${{ vars.DISCORD_WEBHOOK || 'https://discord.com/api/webhooks/fake' }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"✅ EMS Platform v${{ needs.build.outputs.tag }} deployed!\nVM: \`${{ vars.VM_HOST }}\`\"}"
        continue-on-error: true

      - name: Discord Failure
        if: failure()
        run: |
          curl -X POST "${{ vars.DISCORD_WEBHOOK || 'https://discord.com/api/webhooks/fake' }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"❌ EMS Platform deployment FAILED!\nTag: \`${{ needs.build.outputs.tag }}\`\"}"
        continue-on-error: true

  # ============================================
  # MANUAL ACTIONS
  # ============================================
  manual:
    name: 'Manual Actions'
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: production

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Get Tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || 'latest' }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Using tag: $TAG"

      - name: Restart Services
        if: github.event.inputs.action == 'restart'
        run: |
          VM_IP="${{ vars.VM_HOST }}"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key ubuntu@$VM_IP << "ENDSSH"
          cd /home/ubuntu/ems-platform
          docker compose restart
          echo "✅ Services restarted"
          ENDSSH

      - name: View Logs
        if: github.event.inputs.action == 'logs'
        run: |
          VM_IP="${{ vars.VM_HOST }}"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key ubuntu@$VM_IP << "ENDSSH"
          cd /home/ubuntu/ems-platform
          docker compose logs --tail=30
          ENDSSH

      - name: Check Status
        if: github.event.inputs.action == 'status'
        run: |
          VM_IP="${{ vars.VM_HOST }}"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key ubuntu@$VM_IP << "ENDSSH"
          echo "=== EMS Platform Status ==="
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          echo ""
          echo "=== Resource Usage ==="
          docker stats --no-stream --format "table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}"
          ENDSSH

      - name: Deploy Specific Tag
        if: github.event.inputs.action == 'deploy'
        run: |
          VM_IP="${{ vars.VM_HOST }}"
          TAG="${{ steps.tag.outputs.tag }}"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key ubuntu@$VM_IP << "ENDSSH"
          set -e
          cd /home/ubuntu/ems-platform

          export REGISTRY="${{ env.REGISTRY }}"
          export IMAGE_PREFIX="${{ env.IMAGE_PREFIX }}"

          echo "Pulling images with tag: $TAG"
          docker compose pull

          echo "Restarting with tag: $TAG"
          docker compose up -d --remove-orphans

          echo "✅ Deploy complete!"
          ENDSSH
