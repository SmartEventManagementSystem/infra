name: Deploy to Production

on:
  # Chỉ trigger khi có TAG (vd: v1.0.0, v1.2.3)
  push:
    tags:
      - 'v*'
    branches:
      - main

  # Manual trigger
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  # ============================================
  # BUILD IMAGES
  # ============================================
  build:
    name: 'Build & Push Images'
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      sha_short: ${{ steps.vars.outputs.sha_short }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "sha_short=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "Image tag: $TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------
      # Build web-client (React)
      # ----------------------------------------
      - name: Build web-client
        if: github.event.inputs.web_client != 'false'
        run: |
          echo "Building web-client..."
          # Check if Dockerfile exists, if not create one
          if [ ! -f web-client/Dockerfile ]; then
            cat > web-client/Dockerfile << 'EOF'
            FROM node:20-alpine AS builder
            WORKDIR /app
            COPY package*.json ./
            RUN npm ci
            COPY . .
            RUN npm run build

            FROM nginx:alpine
            COPY --from=builder /app/dist /usr/share/nginx/html
            COPY nginx.conf /etc/nginx/conf.d/default.conf
            EXPOSE 80
            CMD ["nginx", "-g", "daemon off;"]
            EOF
            cat > web-client/nginx.conf << 'EOF'
            server {
                listen 80;
                server_name localhost;
                root /usr/share/nginx/html;
                index index.html;

                location / {
                    try_files $uri $uri/ /index.html;
                }

                location /api/ {
                    proxy_pass http://backend:8080/;
                }
            }
            EOF
          fi
        working-directory: .

      - name: Build and Push web-client
        if: github.event.inputs.web_client != 'false'
        uses: docker/build-push-action@v6
        with:
          context: ./web-client
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web-client:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web-client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----------------------------------------
      # Build event-service (Go BE)
      # ----------------------------------------
      - name: Build event-service
        uses: docker/build-push-action@v6
        with:
          context: ./event-service-platform
          file: ./event-service-platform/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/event-service:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/event-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----------------------------------------
      # Build ai-service (Go AI)
      # ----------------------------------------
      - name: Build ai-service
        uses: docker/build-push-action@v6
        with:
          context: ./ai-platform
          file: ./ai-platform/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/ai-service:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/ai-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----------------------------------------
      # Build ai-service (Go AI)
      # ----------------------------------------
      - name: Build data-platform
        if: github.event.inputs.data_platform != 'false'
        uses: docker/build-push-action@v6
        with:
          context: ./data-platform
          file: ./data-platform/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/data-platform:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/data-platform:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true

  # ============================================
  # DEPLOY TO PRODUCTION
  # ============================================
  deploy:
    name: 'Deploy to Production'
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy Core Services
        run: |
          VM_IP="${{ vars.VM_HOST || vars.PRODUCTION_VM_IP }}"
          TAG="${{ needs.build.outputs.tag }}"

          if [ -z "$VM_IP" ]; then
            echo "❌ VM_HOST not set!"
            exit 1
          fi

          echo "Deploying to $VM_IP with tag $TAG"

          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key ubuntu@$VM_IP << "ENDSSH"
          set -e
          cd /home/ubuntu/ems-platform

          # Login to GHCR
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ${{ env.REGISTRY }} -u '${{ github.actor }}' --password-stdin

          # Create production docker-compose
          cat > docker-compose.prod.yml << 'EOF'
          version: '3.8'

          services:
            # ============================================
            # Nginx - Reverse Proxy
            # ============================================
            nginx:
              image: nginx:alpine
              container_name: ems-nginx
              restart: always
              ports:
                - "80:80"
                - "443:443"
              volumes:
                - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
              depends_on:
                - web-client
                - event-service
                - ai-service
              networks:
                - ems-network

            # ============================================
            # Web Client - React Frontend
            # ============================================
            web-client:
              image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web-client:$TAG
              container_name: ems-web-client
              restart: always
              ports:
                - "3000:80"
              depends_on:
                - event-service
              networks:
                - ems-network

            # ============================================
            # Event Service - Go Backend
            # ============================================
            event-service:
              image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/event-service:$TAG
              container_name: ems-event-service
              restart: always
              environment:
                - DATABASE_URL=postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ vars.DB_HOST }}:5432/${{ secrets.DB_NAME }}
                - REDIS_URL=redis://:${{ secrets.REDIS_PASSWORD }}@${{ vars.REDIS_HOST }}:6379/0
                - KAFKA_BROKERS=${{ vars.KAFKA_BROKERS }}
                - JWT_SECRET=${{ secrets.JWT_SECRET }}
                - PORT=8080
                - GIN_MODE=release
              ports:
                - "8080:8080"
              depends_on:
                - postgres
              networks:
                - ems-network
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
                interval: 30s
                timeout: 10s
                retries: 3

            # ============================================
            # AI Service - Go AI Backend
            # ============================================
            ai-service:
              image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/ai-service:$TAG
              container_name: ems-ai-service
              restart: always
              environment:
                - DATABASE_URL=postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ vars.DB_HOST }}:5432/${{ secrets.DB_NAME }}
                - REDIS_URL=redis://:${{ secrets.REDIS_PASSWORD }}@${{ vars.REDIS_HOST }}:6379/0
                - OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
                - PORT=8081
              ports:
                - "8081:8081"
              depends_on:
                - postgres
              networks:
                - ems-network
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
                interval: 30s
                timeout: 10s
                retries: 3

            # ============================================
            # PostgreSQL - Database
            # ============================================
            postgres:
              image: postgres:15-alpine
              container_name: ems-postgres
              restart: always
              environment:
                - POSTGRES_USER=${{ secrets.DB_USER }}
                - POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}
                - POSTGRES_DB=${{ secrets.DB_NAME }}
              ports:
                - "5432:5432"
              volumes:
                - postgres_data:/var/lib/postgresql/data
              networks:
                - ems-network
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U ${{ secrets.DB_USER }}"]
                interval: 30s
                timeout: 10s
                retries: 5

            # ============================================
            # Redis - Cache
            # ============================================
            redis:
              image: redis:7-alpine
              container_name: ems-redis
              restart: always
              command: redis-server --requirepass ${{ secrets.REDIS_PASSWORD }} --appendonly yes
              ports:
                - "6379:6379"
              volumes:
                - redis_data:/data
              networks:
                - ems-network

          # ============================================
          # Volumes
          # ============================================
          volumes:
            postgres_data:
            redis_data:

          # ============================================
          # Networks
          # ============================================
          networks:
            ems-network:
              name: ems-network
              driver: bridge
          EOF

          # Pull new images
          docker compose -f docker-compose.prod.yml pull

          # Restart services
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

          echo "✅ Deployment complete!"
          ENDSSH

      - name: Health Check
        run: |
          VM_IP="${{ vars.VM_HOST || vars.PRODUCTION_VM_IP }}"
          sleep 45

          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key ubuntu@$VM_IP << "ENDSSH"
          echo "=== Container Status ==="
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

          echo ""
          echo "=== Health Checks ==="
          curl -sf http://localhost/health && echo "✅ Nginx OK" || echo "❌ Nginx DOWN"
          curl -sf http://localhost:8080/health && echo "✅ Event Service OK" || echo "❌ Event Service DOWN"
          curl -sf http://localhost:8081/health && echo "✅ AI Service OK" || echo "❌ AI Service DOWN"
          curl -sf http://localhost:3000 && echo "✅ Web Client OK" || echo "❌ Web Client DOWN"
          ENDSSH

      - name: Discord Success Notification
        if: success()
        run: |
          curl -X POST "${{ vars.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{
              "content": "✅ EMS Platform v'${{ needs.build.outputs.tag }}' deployed successfully!\nTag: `'${{ needs.build.outputs.tag }}'`\nCommit: `'${{ github.sha }}'`"
            }'
        continue-on-error: true

      - name: Discord Failure Notification
        if: failure()
        run: |
          curl -X POST "${{ vars.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{
              "content": "❌ EMS Platform deployment FAILED!\nTag: `'${{ needs.build.outputs.tag }}'`\nCommit: `'${{ github.sha }}'`"
            }'
        continue-on-error: true
