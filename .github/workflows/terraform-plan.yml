name: Terraform CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'terraform/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/**'

env:
  TF_VERSION: '1.7.0'
  TF_CLOUD_TOKEN: ${{ secrets.TF_CLOUD_TOKEN }}

jobs:
  # ============================================
  # TERRAFORM PLAN - Oracle Cloud
  # ============================================
  terraform-oracle-plan:
    name: 'Terraform Plan - Oracle Cloud'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/oracle

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true

      - name: Configure OCI CLI
        run: |
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > /tmp/oci_key
          chmod 600 /tmp/oci_key
          cat > /tmp/oci_config << 'EOF'
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=/tmp/oci_key
          EOF
          mkdir -p ~/.oci
          mv /tmp/oci_config ~/.oci/config

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        id: validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color \
            -var-file="terraform.tfvars" \
            -out=tfplan
        continue-on-error: true

      - name: Upload Plan Artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: oracle-terraform-plan
          path: terraform/oracle/tfplan
          retention-days: 5

      - name: Comment Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const plan = require('fs').readFileSync('terraform/oracle/tfplan', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Terraform Plan - Oracle Cloud\n\n```terraform\n' + plan.substring(0, 60000) + '\n```'
            });

  # ============================================
  # TERRAFORM PLAN - GCP
  # ============================================
  terraform-gcp-plan:
    name: 'Terraform Plan - GCP'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/gcp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        id: validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color \
            -var-file="terraform.tfvars" \
            -var="oracle_vm_ip=${{ vars.ORACLE_VM_IP }}" \
            -out=tfplan
        continue-on-error: true

      - name: Upload Plan Artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: gcp-terraform-plan
          path: terraform/gcp/tfplan
          retention-days: 5

      - name: Comment Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const plan = require('fs').readFileSync('terraform/gcp/tfplan', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Terraform Plan - GCP\n\n```terraform\n' + plan.substring(0, 60000) + '\n```'
            });
