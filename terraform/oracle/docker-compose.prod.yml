version: '3.8'

services:
  # ============================================
  # Nginx Proxy Manager - Reverse Proxy + UI
  # ============================================
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: ems-nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "81:81"  # Admin UI
    environment:
      - DB_MYSQL_HOST=nginx-proxy-db
      - DB_MYSQL_PORT=3306
      - DB_MYSQL_NAME=npm
      - DB_MYSQL_USER=npm
      - DB_MYSQL_PASSWORD=${NPM_DB_PASSWORD:-npm_password}
    volumes:
      - ./data/nginx-proxy-manager:/data
      - ./letsencrypt:/etc/letsencrypt
    depends_on:
      - nginx-proxy-db
    networks:
      - ems-network

  nginx-proxy-db:
    image: jc21/mariadb:latest
    container_name: ems-nginx-proxy-db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${NPM_ROOT_PASSWORD:-root_password}
      - MYSQL_DATABASE=npm
      - MYSQL_USER=npm
      - MYSQL_PASSWORD=${NPM_DB_PASSWORD:-npm_password}
    volumes:
      - nginx_proxy_db:/var/lib/mysql
    networks:
      - ems-network

  # ============================================
  # Web Client - React Frontend
  # ============================================
  web-client:
    image: ${REGISTRY}/web-client:${TAG:-latest}
    container_name: ems-web-client
    restart: always
    environment:
      - NODE_ENV=production
      - API_URL=${API_URL:-http://event-service:8080}
    expose:
      - "80"
    networks:
      - ems-network

  # ============================================
  # Event Service - Go Backend
  # ============================================
  event-service:
    image: ${REGISTRY}/event-service:${TAG:-latest}
    container_name: ems-event-service
    restart: always
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/${DB_NAME}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@${REDIS_HOST:-redis}:6379/0
      - KAFKA_BROKERS=${KAFKA_BROKERS:-kafka:29092}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=8080
      - GIN_MODE=release
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ems-network

  # ============================================
  # AI Service - Go AI Backend
  # ============================================
  ai-service:
    image: ${REGISTRY}/ai-service:${TAG:-latest}
    container_name: ems-ai-service
    restart: always
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/${DB_NAME}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@${REDIS_HOST:-redis}:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PORT=8081
      - GIN_MODE=release
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ems-network

  # ============================================
  # PostgreSQL - Database
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: ems-postgres
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - ems-network

  # ============================================
  # Redis - Cache
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: ems-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - ems-network

  # ============================================
  # Kafka - Message Broker (Optional)
  # ============================================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ems-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - ems-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: ems-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - ems-network

  # ============================================
  # Kafka UI - Kafka Management
  # ============================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ems-kafka-ui
    restart: always
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - ems-network

# ============================================
# Volumes
# ============================================
volumes:
  postgres_data:
  redis_data:
  nginx_proxy_db:
  data:
  letsencrypt:

# ============================================
# Networks
# ============================================
networks:
  ems-network:
    name: ems-network
    driver: bridge
