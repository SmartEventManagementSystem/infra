server:
  port: 8080
  mode: local

database:
  protocol: postgresql
  url: postgres
  replica_url: postgres
  name: ems_events
  port: 5432
  username: emsuser
  password: password123
  ssl_mode: disable
  max_db_conns: 10
  max_idle_db_conns: 5

redis:
  hosts: redis:6379
  pool_size: 10
  min_idle_conns: 5

jwt:
  secret_key: your_jwt_secret_here_change_in_production
  access_expiration: 24h
  refresh_expiration: 168h

router:
  base_path: /api/v1

aws:
  region: ap-southeast-1
  access_key: ""
  secret_key: ""

bcrypt:
  cost: 10
