apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argo-rollouts

resources:
  - github.com/argoproj/argo-rollouts/namespace?ref=v1.8.2
  - namespace.yaml
  - crd.yaml
  - install.yaml
  - dashboard.yaml
  - rbac.yaml

patches:
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argo-rollouts-config
      data:
        metrics.enabled: "true"
        analysis.enabled: "true"
        experiment.enabled: "true"
        notification.enabled: "false"
