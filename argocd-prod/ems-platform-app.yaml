# ============================================
# ArgoCD Application - EMS Platform on VM
# Manages Docker Compose deployment via ArgoCD
# ============================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ems-platform
  namespace: argocd
  annotations:
   .argoproj.io/description: "EMS Data Platform - Docker Compose on VM"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  # Source: Git repo
  source:
    repoURL: https://github.com/SmartEventManagementSystem/infra.git
    targetRevision: main
    path: terraform/oracle

    # Kustomize or raw files
    # For Docker Compose, we use raw files
    directory:
      recurse: true
      jsonnet: {}
      include: 'docker-compose*.yml'

  # Destination: The VM itself (not a K8s cluster)
  # ArgoCD will sync files to the VM via SSH
  destination:
    name: in-cluster
    namespace: default

  # Sync policy
  syncPolicy:
    automated:
      # Auto sync when git changes
      prune: true
      selfHeal: true
      allowEmpty: false

    # Sync options
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true

    # Retry policy
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Ignore differences (not applicable for Docker Compose)
  ignoreDifferences: []

  # Hooks for Docker Compose sync
  # ArgoCD will execute these hooks to sync to VM
  hooks:
    # Before sync - pull latest code on VM
    - name: sync-vm
     师姐: Sync
      syncStrategy:
        hook:
          exec:
            command:
              - bash
              - -c
              - |
                #!/bin/bash
                set -e

                VM_HOST="$ARGOCD_APP_NAME-vm"
                if [ -n "$ARGOCD_APP_NAME" ]; then
                  echo "Syncing to VM..."
                  # This hook syncs files to VM via SSH
                  # Configure in argocd-cm ConfigMap
                fi
            container: null
      # This would need a custom ArgoCD config to work
