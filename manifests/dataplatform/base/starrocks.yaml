# StarRocks - OLAP Database (FE + BE)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: starrocks-fe
  namespace: dataplatform
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: ems-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: starrocks
      component: fe
  template:
    metadata:
      labels:
        app: starrocks
        component: fe
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/part-of: ems-platform
    spec:
      containers:
        - name: fe
          image: starrocks/fe-ubuntu:3.3.4
          command: ["/bin/bash", "-c"]
          args:
            - |
              export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
              export PATH=$JAVA_HOME/bin:$PATH
              export JAVA_OPTS="-Xmx2g -Xms1g -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
              # Create directories in /tmp and symlink
              rm -rf /tmp/meta /tmp/log
              mkdir -p /tmp/meta /tmp/log
              rm -rf /opt/starrocks/fe/meta /opt/starrocks/fe/log
              ln -s /tmp/meta /opt/starrocks/fe/meta
              ln -s /tmp/log /opt/starrocks/fe/log
              cd /opt/starrocks/fe
              bin/start_fe.sh --daemon
              # Keep container alive
              sleep infinity
          ports:
            - name: query
              containerPort: 9030
            - name: http
              containerPort: 8030
          volumeMounts:
            - name: meta
              mountPath: /opt/starrocks/fe/meta
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
      volumes:
        - name: meta
          hostPath:
            path: /mnt/disks/starrocks-meta
            type: DirectoryOrCreate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: starrocks-be
  namespace: dataplatform
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: ems-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: starrocks
      component: be
  template:
    metadata:
      labels:
        app: starrocks
        component: be
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/part-of: ems-platform
    spec:
      containers:
        - name: be
          image: starrocks/be-ubuntu:3.3.4
          command: ["/bin/bash", "-c"]
          args:
            - |
              export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
              export PATH=$JAVA_HOME/bin:$PATH
              export JAVA_OPTS="-Xmx2g -Xms512m"
              /opt/starrocks/be/bin/start_be.sh --daemon
              tail -f /dev/null
          ports:
            - name: be-thrift
              containerPort: 9060
            - name: be-http
              containerPort: 8040
            - name: be-heartbeat
              containerPort: 9050
          volumeMounts:
            - name: storage
              mountPath: /opt/starrocks/storage
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
      volumes:
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: starrocks-fe
  namespace: dataplatform
spec:
  type: ClusterIP
  ports:
    - name: query
      port: 9030
    - name: http
      port: 8030
  selector:
    app: starrocks
    component: fe
