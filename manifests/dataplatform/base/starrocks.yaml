# StarRocks - OLAP Database (FE + BE)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: starrocks-fe
  namespace: dataplatform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: starrocks
      component: fe
  template:
    metadata:
      labels:
        app: starrocks
        component: fe
    spec:
      containers:
        - name: fe
          image: starrocks/fe-ubuntu:3.3.4
          command: ["/bin/bash", "-c"]
          args:
            - |
              export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
              /opt/starrocks/fe/bin/start_fe.sh --daemon
              tail -f /dev/null
          ports:
            - name: query
              containerPort: 9030
            - name: http
              containerPort: 8030
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 8030
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8030
            initialDelaySeconds: 120
            periodSeconds: 20
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: starrocks-be
  namespace: dataplatform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: starrocks
      component: be
  template:
    metadata:
      labels:
        app: starrocks
        component: be
    spec:
      containers:
        - name: be
          image: starrocks/be-ubuntu:3.3.4
          command: ["/bin/bash", "-c"]
          args:
            - |
              /opt/starrocks/be/bin/start_be.sh --daemon
              tail -f /dev/null
          ports:
            - name: be-thrift
              containerPort: 9060
            - name: be-http
              containerPort: 8040
            - name: be-heartbeat
              containerPort: 9050
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: 8040
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8040
            initialDelaySeconds: 120
            periodSeconds: 20
          volumeMounts:
            - name: storage
              mountPath: /opt/starrocks/storage
      volumes:
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: starrocks-fe
  namespace: dataplatform
spec:
  type: ClusterIP
  ports:
    - name: query
      port: 9030
    - name: http
      port: 8030
  selector:
    app: starrocks
    component: fe
