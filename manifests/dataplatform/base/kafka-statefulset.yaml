# Kafka KRaft mode (no Zookeeper) — single broker
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: dataplatform
spec:
  serviceName: kafka-headless
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: kafka
          image: apache/kafka:3.7.0
          imagePullPolicy: Always
          command: ["bash", "-c"]
          args:
            - |
              # Generate cluster ID
              CLUSTER_ID=$(/opt/kafka/bin/kafka-storage.sh random-uuid)

              # Configure server.properties inline
              cat > /tmp/server.properties << 'EOF'
              node.id=0
              process.roles=broker,controller
              controller.quorum.voters=0@kafka-0.kafka-headless.dataplatform.svc.cluster.local:9093
              controller.listener.names=CONTROLLER
              inter.broker.listener.name=PLAINTEXT
              listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
              listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
              advertised.listeners=PLAINTEXT://kafka-0.kafka-headless.dataplatform.svc.cluster.local:9092
              log.dirs=/var/lib/kafka/data
              offsets.topic.replication.factor=1
              transaction.state.log.replication.factor=1
              transaction.state.log.min.isr=1
              auto.create.topics.enable=true
              log.retention.hours=168
              EOF

              # Format storage
              /opt/kafka/bin/kafka-storage.sh format -t $CLUSTER_ID -c /tmp/server.properties --ignore-formatted

              # Start Kafka
              exec /opt/kafka/bin/kafka-server-start.sh /tmp/server.properties
          ports:
            - name: plaintext
              containerPort: 9092
            - name: controller
              containerPort: 9093
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 60
            periodSeconds: 10
      volumes:
        - name: kafka-data
          emptyDir: {}
