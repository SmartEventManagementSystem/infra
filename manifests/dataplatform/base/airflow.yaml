# Apache Airflow with SequentialExecutor (for testing)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-webserver
  namespace: dataplatform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow
      component: webserver
  template:
    metadata:
      labels:
        app: airflow
        component: webserver
    spec:
      containers:
        - name: airflow-webserver
          image: apache/airflow:2.10.1
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c"]
          args:
            - |
              mkdir -p /opt/airflow
              export AIRFLOW__CORE__SQL_ALCHEMY_CONN="sqlite:////opt/airflow/airflow.db"
              airflow db migrate || true
              airflow connections create-default-connections || true
              airflow users create --username admin --password admin123 --firstname Admin --lastname User --role Admin --email admin@example.com 2>/dev/null || echo "User may already exist"
              airflow webserver --port 8080
          ports:
            - name: webserver
              containerPort: 8080
          env:
            - name: AIRFLOW__CORE__EXECUTOR
              value: SequentialExecutor
            - name: AIRFLOW__CORE__FERNET_KEY
              value: "ZThiOTBjMDAtMzg1OC00YjJiLTkzOTMtMGI2MjJjZmFhZDEy"
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "false"
            - name: AIRFLOW__WEBSERVER__WEB_SERVER_WEB_SERVER_HOST
              value: "0.0.0.0"
            - name: AIRFLOW__WEBSERVER__WEB_SERVER_PORT
              value: "8080"
            - name: AIRFLOW__API__AUTH_BACKENDS
              value: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-scheduler
  namespace: dataplatform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow
      component: scheduler
  template:
    metadata:
      labels:
        app: airflow
        component: scheduler
    spec:
      containers:
        - name: airflow-scheduler
          image: apache/airflow:2.10.1
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c"]
          args:
            - |
              mkdir -p /opt/airflow
              airflow db init || true
              airflow scheduler
          env:
            - name: AIRFLOW__CORE__EXECUTOR
              value: SequentialExecutor
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: airflow-webserver
  namespace: dataplatform
spec:
  type: ClusterIP
  ports:
    - name: webserver
      port: 8080
      targetPort: 8080
  selector:
    app: airflow
    component: webserver
