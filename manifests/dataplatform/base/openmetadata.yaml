# OpenMetadata - Data Catalog & Governance
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openmetadata
  namespace: dataplatform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openmetadata
  template:
    metadata:
      labels:
        app: openmetadata
    spec:
      containers:
        - name: openmetadata-server
          image: openmetadata/server:1.0.4
          ports:
            - name: http
              containerPort: 8585
          env:
            - name: SERVER_PORT
              value: "8585"
            - name: DB_HOST
              value: "$(POSTGRES_HOST)"
            - name: DB_PORT
              value: "5432"
            - name: DB_SCHEME
              value: "postgresql"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: dataplatform-secrets
                  key: om-db-user
                  optional: true
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dataplatform-secrets
                  key: om-db-password
                  optional: true
            - name: AIRFLOW_HOST
              value: "airflow-webserver.dataplatform.svc.cluster.local"
            - name: AIRFLOW_PORT
              value: "8080"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /api/v1/version
              port: 8585
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/version
              port: 8585
            initialDelaySeconds: 120
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: openmetadata
  namespace: dataplatform
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8585
      targetPort: 8585
  selector:
    app: openmetadata
