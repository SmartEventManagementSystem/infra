# OpenMetadata - Data Catalog & Governance
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openmetadata
  namespace: dataplatform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openmetadata
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: openmetadata
    spec:
      containers:
        - name: openmetadata-server
          image: openmetadata/server:2.1.0
          ports:
            - name: http
              containerPort: 8585
          env:
            - name: SERVER_PORT
              value: "8585"
            - name: DB_HOST
              value: "mysql.dataplatform.svc.cluster.local"
            - name: DB_PORT
              value: "3306"
            - name: DB_SCHEME
              value: "mysql"
            - name: DB_USER
              value: "root"
            - name: DB_PASSWORD
              value: "mysqlroot123"
            - name: DB_DATABASE
              value: "openmetadata_db"
            - name: ELASTICSEARCH_HOST
              value: "elasticsearch.dataplatform.svc.cluster.local"
            - name: ELASTICSEARCH_PORT
              value: "9200"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: openmetadata
  namespace: dataplatform
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8585
      targetPort: 8585
  selector:
    app: openmetadata
