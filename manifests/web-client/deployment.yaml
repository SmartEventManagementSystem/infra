apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-client
  namespace: web-client
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-client
        app.kubernetes.io/version: v1.0.0
    spec:
      containers:
        - name: web-client
          image: ghcr.io/ems-project/web-client:v1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web-client
  namespace: web-client
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app.kubernetes.io/name: web-client
