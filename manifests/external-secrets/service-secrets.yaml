# External Secrets for event-service
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: event-service-secrets
  namespace: event-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore
  target:
    name: event-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: db-password
      remoteRef:
        key: ems-db-password
    - secretKey: db-user
      remoteRef:
        key: ems-db-user
    - secretKey: db-name
      remoteRef:
        key: ems-db-name
    - secretKey: db-host
      remoteRef:
        key: ems-db-host
    - secretKey: jwt-secret
      remoteRef:
        key: ems-jwt-secret
---
# External Secrets for ai-service
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ai-service-secrets
  namespace: ai-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore
  target:
    name: ai-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: openai-api-key
      remoteRef:
        key: ems-openai-api-key
---
# ghcr.io image pull secret
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret
  namespace: web-client
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore
  target:
    name: ghcr-pull-secret
    creationPolicy: Owner
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: ems-ghcr-config
