# BigTable (HBase API) Configuration
# Use GCP BigTable for NoSQL/Time-series data
apiVersion: v1
kind: ConfigMap
metadata:
  name: bigtable-config
  namespace: dataplatform
data:
  GCP_PROJECT_ID: "project-5ca79767-316d-4e68-a56"
  GCP_REGION: "asia-southeast1"
  BIGTABLE_INSTANCE: "ems-nosql"
  BIGTABLE_CLUSTER: "ems-nosql-cluster"
  BIGTABLE_ZONE: "asia-southeast1-b"
