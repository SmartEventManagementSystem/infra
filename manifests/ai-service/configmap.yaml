# AI Service ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-service-config
  namespace: ai-service
data:
  config.yaml: |
    app:
      name: ai-service
      version: 1.0.0
      port: 8081
      environment: production

    huggingface:
      api_url: https://api-inference.huggingface.co/models
      timeout: 120s
      max_retries: 3
      default_model: mistralai/Mistral-7B-Instruct-v0.2

    models:
      chat:
        provider: huggingface
        model: mistralai/Mistral-7B-Instruct-v0.2
        max_tokens: 2048
        temperature: 0.7
      embedding:
        provider: huggingface
        model: sentence-transformers/all-MiniLM-l6-v2
        dimension: 384
      reranker:
        provider: huggingface
        model: cross-encoder/ms-marco-MiniLM-L-6-v2

    kafka:
      brokers:
        - ${KAFKA_BROKERS}
      consumer_group: ai-service-consumer
      topics:
        chat_requests: chat.requests
        chat_responses: chat.responses
        rag_updates: rag.updates

    vector_db:
      type: qdrant
      url: ${QDRANT_URL}
      collection_name: ems_events
      vector_size: 384

    mcp:
      enabled: true
      tools:
        - weather
        - calendar
        - search
      max_concurrent_tools: 3

    observability:
      metrics_enabled: true
      metrics_port: 9091
      tracing_enabled: true
