# AI Service Deployment with Argo Rollouts (Blue-Green Strategy)
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ai-service
  namespace: ai-service
  labels:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/component: ai
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-service
        app.kubernetes.io/version: v1.0.0
    spec:
      containers:
        - name: ai-service
          image: ghcr.io/ems-project/ai-service:v1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
              name: http
              protocol: TCP
            - containerPort: 9091
              name: metrics
              protocol: TCP
          env:
            - name: HF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-service-secrets
                  key: hf-api-token
            - name: KAFKA_BROKERS
              value: "kafka.dataplatform.svc.cluster.local:9092"
            - name: REDIS_HOST
              value: "redis.dataplatform.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: RAG_VECTOR_DB
              value: "qdrant"
            - name: QDRANT_URL
              value: "http://qdrant.dataplatform.svc.cluster.local:6333"
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
  strategy:
    blueGreen:
      activeService: ai-service-active
      previewService: ai-service-preview
      autoPromotionEnabled: false
      autoPromotionSeconds: 0
      previewReplicaCount: 1
      scaleDownDelaySeconds: 30
      scaleDownDelayRevisionHistoryLimit: 3
  analysis:
    successfulRunHistoryLimit: 3
    failedRunHistoryLimit: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service-active
  namespace: ai-service
spec:
  ports:
    - port: 80
      targetPort: 8081
      name: http
  selector:
    app.kubernetes.io/name: ai-service
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service-preview
  namespace: ai-service
spec:
  ports:
    - port: 80
      targetPort: 8081
      name: http
  selector:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/version: preview
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-service
  namespace: ai-service
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - api-ai.ems.local
      secretName: ai-service-tls
  rules:
    - host: api-ai.ems.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-service-active
                port:
                  number: 80
